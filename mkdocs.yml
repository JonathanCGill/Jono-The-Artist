site_name: Jono, the Artist
site_description: Art Portfolio - Acrylic & Watercolour Paintings
site_url: https://jonoart.co.za/

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: DM Sans
    code: Roboto Mono
  features:
    - navigation.indexes
    - navigation.top
  favicon: favicon.ico
  logo: photos/Jono.jpg

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap
  - https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css
  - stylesheets/custom.css
  - stylesheets/jono.css

plugins:
  - search:
      enabled: false

extra:
  generator: false

nav:
  - Home: index.md
  - Collection: collection.md
  - Stories:
    - stories/index.md
    - Aeromechanica: stories/Aeromechanica/index.md
    - Cantabrian Mountains: stories/Cantabrian Mountains/index.md
    - Guggenheim: stories/Guggenheim/index.md
    - Lighthouses: stories/Lighthouses/index.md
    - Called to Prayer: stories/Standing Outside/index.md
    - The Know Where Series: stories/The-Road-to-Know-Where/index.md
    - The Grand Insect Hotel: stories/The Insect Hotel/index.md
    - The Last Holiday: stories/The Last Holiday/index.md
    - The Netherlands: stories/The Netherlands/index.md
    - The Villages: stories/The Villages/index.md
  - Essays:
    - essays.md
    - Painting with a Critic: essays/painting-with-a-critic.md
    - The Architecture of Trust: essays/the-architecture-of-trust.md
    - The Tragedy of the Commons: essays/tragedy-of-the-commons.md
    - The Delegation Trap: essays/ai_overdependence_and_system_one_thinking.md
  - About: about.md
  - Catalogue: catalogue.md
