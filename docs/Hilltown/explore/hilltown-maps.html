<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hilltown Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1a73e8;--txt:#202124;--sub:#5f6368;--line:#dadce0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,Arial,sans-serif;color:var(--txt);background:#e8e6e1}
  #map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  #map.dragging{cursor:grabbing}
  #map.measuring{cursor:crosshair}
  .ns{vector-effect:non-scaling-stroke}
  .rA-c{stroke:#e2a33a;stroke-width:var(--wAc)} .rA{stroke:#fdd877;stroke-width:var(--wA)}
  .rB-c{stroke:#cfccc6;stroke-width:var(--wBc)} .rB{stroke:#fff;stroke-width:var(--wB)}
  .rM-c{stroke:#d6d3cd;stroke-width:var(--wMc)} .rM{stroke:#fff;stroke-width:var(--wM)}
  .road{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .lbl{font-family:Roboto,Arial,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  /* top bar */
  #top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 10px 0;pointer-events:none;z-index:5}
  #searchwrap{pointer-events:auto;max-width:420px;background:#fff;border-radius:24px;box-shadow:0 2px 6px rgba(60,64,67,.3);display:flex;align-items:center;height:48px;padding:0 6px 0 14px}
  #searchwrap svg{flex:none}
  #q{flex:1;border:0;outline:0;font:16px Roboto,Arial,sans-serif;padding:0 10px;color:var(--txt);background:transparent;min-width:0}
  #clearq{border:0;background:none;width:40px;height:40px;border-radius:20px;display:none;cursor:pointer}
  #results{pointer-events:auto;max-width:420px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(60,64,67,.3);margin-top:6px;max-height:50vh;overflow:auto;display:none}
  .res{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f1f3f4}
  .res:hover{background:#f1f3f4}
  .res .t{font-size:15px}.res .s{font-size:13px;color:var(--sub)}
  .ico{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
  #chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;max-width:100%}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:#fff;box-shadow:0 1px 3px rgba(60,64,67,.3);font-size:14px;color:#3c4043;border:0;cursor:pointer;font-family:inherit}
  .chip.on{background:#e8f0fe;color:#1967d2}
  .chip svg{width:18px;height:18px}
  /* controls */
  #ctrls{position:absolute;right:12px;bottom:calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:4;transition:bottom .25s}
  .fab{width:44px;height:44px;border-radius:22px;background:#fff;border:0;box-shadow:0 2px 6px rgba(60,64,67,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#5f6368}
  .fab.on{color:var(--blue)}
  .zoom{border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(60,64,67,.3);display:flex;flex-direction:column}
  .zoom button{width:44px;height:44px;border:0;background:#fff;font-size:24px;color:#5f6368;cursor:pointer}
  .zoom button+button{border-top:1px solid #e8eaed}
  #compass{position:absolute;right:12px;top:calc(118px + env(safe-area-inset-top));z-index:4}
  #scale{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;font-size:11px;color:#3c4043;display:flex;align-items:flex-end;gap:8px;transition:bottom .25s}
  #scale .bar{border:2px solid #3c4043;border-top:0;height:6px}
  #scale .attr{background:rgba(255,255,255,.75);padding:1px 5px;border-radius:3px}
  /* place card */
  #card{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(60,64,67,.25);z-index:6;transform:translateY(110%);transition:transform .25s;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:55vh;overflow:auto}
  #card.show{transform:none}
  #card .grab{width:36px;height:4px;border-radius:2px;background:#dadce0;margin:2px auto 10px}
  #card h2{margin:0 0 2px;font-size:22px;font-weight:400}
  #card .cat{color:var(--sub);font-size:14px;margin-bottom:10px}
  #card .facts{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#3c4043;margin:8px 0 10px}
  #card .facts b{display:block;font-weight:500;color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  #card p{font-size:14px;line-height:1.45;color:#3c4043;margin:6px 0 12px}
  #card .btns{display:flex;gap:8px;flex-wrap:wrap}
  #card .btn{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--blue);font:500 14px Roboto,Arial;display:flex;align-items:center;gap:6px;cursor:pointer}
  #card .btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
  #closecard{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:18px;border:0;background:#f1f3f4;cursor:pointer;font-size:18px;color:#5f6368}
  #toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#323232;color:#fff;font-size:14px;padding:10px 16px;border-radius:6px;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none;white-space:nowrap}
  @media (min-width:760px){
    #card{left:12px;right:auto;top:calc(110px + env(safe-area-inset-top));bottom:auto;width:380px;border-radius:12px;transform:translateX(-120%);max-height:calc(100% - 140px)}
    #card .grab{display:none}
    #card.show{transform:none}
  }
</style>
</head>

function segd(x,y,pts){let d=1e9;for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1];const vx=x2-x1,vy=y2-y1,L=vx*vx+vy*vy;let t=((x-x1)*vx+(y-y1)*vy)/L;t=Math.max(0,Math.min(1,t));d=Math.min(d,Math.hypot(x-(x1+t*vx),y-(y1+t*vy)));}return d}
const clip=(v,a,b)=>Math.max(a,Math.min(b,v));
function elev(x,y){
  const base=100+0.035*(1360-y);
  const roll=16*Math.sin((x-600)/85)*Math.sin((y-40)/65)*clip((x-600)/80,0,1)*clip((430-y)/60,0,1);
  const dx=x-CX,dy=y-CY,r=Math.hypot(dx,dy),sx=1+0.45*clip((r-150)/200,0,1),rr=Math.hypot(dx/sx,dy);
  const hill=(612-(100+0.035*(1360-CY)))/(1+Math.pow(rr/150,2.2));
  const d=segd(x,y,RIVER),ds=Math.min(segd(x,y,ST1),segd(x,y,ST2));
  const carve=-16*Math.exp(-((d/38)**2))-8*Math.exp(-((ds/25)**2))*(rr>190?1:0);
  const qr=Math.hypot(x-LX,y-LY);let e=base+roll+hill+carve;
  return e-(e-38)/(1+Math.exp((qr-118)/5));
}

let V={k:1,tx:0,ty:0}, K0=1;
const W=()=>svg.clientWidth, H=()=>svg.clientHeight;
function fitAll(anim){const pad=24,top=110;const k=Math.min((W()-pad*2)/W0.w,(H()-top-pad-20)/W0.h);K0=k;const t={k,tx:(W()-W0.w*k)/2-W0.x*k,ty:top+(H()-top-20-W0.h*k)/2-W0.y*k};anim?fly(t):(V=t,render())}
const zrel=()=>V.k/K0;
const toS=(x,y)=>[x*V.k+V.tx,y*V.k+V.ty], toW=(sx,sy)=>[(sx-V.tx)/V.k,(sy-V.ty)/V.k];
function clampView(){const z=zrel();if(z<0.7){const f=0.7*K0/V.k;zoomAt(W()/2,H()/2,f,true)}if(z>14){const f=14*K0/V.k;zoomAt(W()/2,H()/2,f,true)}
  const [x0,y0]=toS(W0.x,W0.y),[x1,y1]=toS(W0.x+W0.w,W0.y+W0.h),m=80;
  if(x1<m)V.tx+=m-x1; if(x0>W()-m)V.tx-=x0-(W()-m); if(y1<m)V.ty+=m-y1; if(y0>H()-m)V.ty-=y0-(H()-m);}
function zoomAt(sx,sy,f,noClamp){V.tx=sx-(sx-V.tx)*f;V.ty=sy-(sy-V.ty)*f;V.k*=f;if(!noClamp)clampView()}
let anim=null;
function fly(t,ms=380){cancelAnimationFrame(anim);const s={...V},t0=performance.now();
  const step=n=>{let u=Math.min(1,(n-t0)/ms);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    const k=s.k*Math.pow(t.k/s.k,u);const cxs=(W()/2-s.tx)/s.k+((W()/2-t.tx)/t.k-(W()/2-s.tx)/s.k)*u,cys=(H()/2-s.ty)/s.k+((H()/2-t.ty)/t.k-(H()/2-s.ty)/s.k)*u;
    V={k,tx:W()/2-cxs*k,ty:H()/2-cys*k};render();if(u<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function flyTo(x,y,z){const k=Math.max(V.k,z*K0);const card=document.getElementById('card').classList.contains('show');const wide=W()>=760;
  const cxp=wide&&card?(W()+400)/2:W()/2, cyp=!wide&&card?H()*0.32:H()/2;fly({k,tx:cxp-x*k,ty:cyp-y*k})}

const state={layers:{flood:false,terrain:false,transit:true,trails:true,underground:false,crash:false},sel:null,drop:null,measure:false,mpts:[]};
const SHIELDS=[["A412",590,250,"A"],["A412",548,520,"A"],["A49",860,1010,"A"],["A49",250,1010,"A"],["B3060",370,430,"B"],["B3060",760,430,"B"],["B3061",110,880,"B"]];
function textW(t,fs){return t.length*fs*0.56}
function render(){
  world.setAttribute('transform',`matrix(${V.k} 0 0 ${V.k} ${V.tx} ${V.ty})`);
  const z=zrel(),s=Math.pow(z,0.62);
  const st=svg.style;st.setProperty('--wA',(3.2*s).toFixed(2)+'px');st.setProperty('--wAc',(3.2*s+2).toFixed(2)+'px');
  st.setProperty('--wB',(2.6*s).toFixed(2)+'px');st.setProperty('--wBc',(2.6*s+1.6).toFixed(2)+'px');
  st.setProperty('--wM',(1.6*s).toFixed(2)+'px');st.setProperty('--wMc',(1.6*s+1.4).toFixed(2)+'px');
  layers.turbines.style.display=z>1.1?'':'none';
  const boxes=[],out=[];
  const hit=b=>boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]);
  const vis=(x,y)=>x>-60&&y>-60&&x<W()+60&&y<H()+60;
  // town labels
  for(const p of D.places.filter(p=>p.cat==='town')){
    const [x,y]=p.id==='hilltown'?toS(800,640):toS(p.x,p.y);const fs=Math.min(26,13+4*Math.log2(z+1));const w=textW(p.name,fs)*1.05;
    const yy=p.id==='hilltown'?y:y+(125*V.k)+fs+6;
    if(!vis(x,yy))continue;const b=[x-w/2,yy-fs,x+w/2,yy+4];boxes.push(b);
    out.push(`<text x="${x}" y="${yy}" text-anchor="middle" class="lbl" font-size="${fs}" font-weight="500" fill="#3c4043" data-id="${p.id}" style="cursor:pointer">${p.name}</text>`);
  }
  // clock numerals
  if(z>1.5){for(let h=1;h<=12;h++){const a=-Math.PI/2+h*Math.PI/6;const [x,y]=toS(CX+215*Math.cos(a),CY+215*Math.sin(a));
    out.push(`<text x="${x}" y="${y+5}" text-anchor="middle" class="lbl" font-size="${Math.min(18,9+2*z)}" font-weight="700" fill="#80868b">${h}</text>`);}}
  // road shields
  if(z>1){for(const[t,wx,wy,c] of SHIELDS){const [x,y]=toS(wx,wy);if(!vis(x,y))continue;const w=t.length*7+10,b=[x-w/2,y-9,x+w/2,y+9];if(hit(b))continue;boxes.push(b);
    out.push(`<g><rect x="${x-w/2}" y="${y-9}" width="${w}" height="18" rx="4" fill="${c==='A'?'#fdd877':'#fff'}" stroke="${c==='A'?'#c88a1c':'#9aa0a6'}"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3c4043">${t}</text></g>`);}}
  // water labels
  if(z>1.3){for(const[t,wx,wy,r] of [["River",404,1300,-82],["Hilltown Falls stream",546,1040,0]].slice(0,1)){const [x,y]=toS(wx,wy);out.push(`<text x="${x}" y="${y}" transform="rotate(${r} ${x} ${y})" class="lbl" font-size="13" font-style="italic" fill="#1967d2">${t}</text>`)}}
  // km posts on Station Walk
  if(state.layers.trails&&z>2.2){const pts=D.walk.slice(1).split(' L').map(s=>s.split(' ').map(Number));let acc=0,next=KM,km=1;
    for(let i=0;i<pts.length-1;i++){const[x1,y1]=pts[i],[x2,y2]=pts[i+1],Lg=Math.hypot(x2-x1,y2-y1);while(acc+Lg>=next){const t=(next-acc)/Lg;const[x,y]=toS(x1+(x2-x1)*t,y1+(y2-y1)*t);
      out.push(`<g><circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="#1e8e3e" stroke-width="1.6"/><text x="${x}" y="${y+3.5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1e8e3e">${km}</text></g>`);km++;next+=KM}acc+=Lg}}
  // crash zone labels
  if(state.layers.crash&&z>1.3){const th=[35,48,62];D.crash.forEach((c,i)=>{const t=th[i]*Math.PI/180,gx=c.rx*Math.cos(t),gy=-33+c.ry*Math.sin(t),r=-5*Math.PI/180;
    const [x,y]=toS(320+gx*Math.cos(r)-gy*Math.sin(r),140+gx*Math.sin(r)+gy*Math.cos(r));
    out.push(`<text x="${x}" y="${y}" class="lbl" font-size="11.5" font-weight="500" fill="#d93025">1:${c.p.toLocaleString('en-GB').replace(/,/g,' ')} per year</text>`)})}
  // POI markers, by priority
  const pois=D.places.filter(p=>p.cat!=='town').filter(p=>state.layers.transit||p.cat!=='transit').filter(p=>state.layers.trails||p.cat!=='trail').sort((a,b)=>a.z-b.z);
  for(const p of pois){
    const sel=state.sel&&state.sel.id===p.id;if(!sel&&z<p.z)continue;
    const [x,y]=toS(p.x,p.y);if(!vis(x,y))continue;
    const col=CAT[p.cat][0],fs=12.5,w=textW(p.name,fs);
    const b=[x-12,y-12,x+16+w,y+12];if(!sel&&hit(b))continue;boxes.push(b);
    const ic=iconFor(p),big=p.cat==='transit'||p.id==='airport';
    out.push(`<g data-id="${p.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${big?12:10.5}" fill="${col}" stroke="#fff" stroke-width="1.6"/>
      <path d="${IC[ic]}" fill="#fff" transform="translate(${x-(big?8:7)} ${y-(big?8:7)}) scale(${big?0.667:0.584})"/>
      <text x="${x+16}" y="${y+4.5}" class="lbl" font-size="${fs}" font-weight="500" fill="${p.cat==='civic'||p.cat==='industry'?'#3c4043':col}">${p.name}</text></g>`);
  }
  // selected pin
  const pinAt=(wx,wy,c)=>{const[x,y]=toS(wx,wy);return `<g transform="translate(${x-15} ${y-38}) scale(1.25)"><path d="${IC.pin}" fill="${c}" stroke="#a50e0e" stroke-width=".8"/></g>`};
  if(state.sel)out.push(pinAt(state.sel.x,state.sel.y,'#ea4335'));
  if(state.drop)out.push(pinAt(state.drop.x,state.drop.y,'#ea4335'));
  // measure
  if(state.mpts.length){const sp=state.mpts.map(p=>toS(p[0],p[1]));
    out.push(`<polyline points="${sp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="5"/><polyline points="${sp.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#1a73e8" stroke-width="2.5"/>`);
    sp.forEach(([x,y],i)=>out.push(`<circle cx="${x}" cy="${y}" r="${i===sp.length-1?6:4.5}" fill="#fff" stroke="#1a73e8" stroke-width="2"/>`));}
  overlay.innerHTML=out.join('');
  // scale bar
  const pxkm=KM*V.k;let best=1;for(const c of [0.05,0.1,0.2,0.5,1,2,5,10]){if(c*pxkm<=110)best=c}

}

/* ---------- place card ---------- */
const card=document.getElementById('card'),cardbody=document.getElementById('cardbody');
const CAT_LABEL=p=>({transit:"Railway station",airport:p.id==='airport'?"International airport":"Airport facility",attraction:"Landmark",civic:"Civic building",school:"School",food:"Public house",shop:"Market",parking:"Car park",industry:"Industry",nature:p.id.startsWith('meadow')?"Flower meadow":"Woodland and open country",water:"Reservoir",trail:"Walking route",town:"Town"})[p.cat];
const btn=(id,label,pri)=>`<button class="btn${pri?' pri':''}" data-act="${id}">${label}</button>`;
function nearest(x,y){let b=null,bd=1e9;for(const p of D.places){if(p.cat==='town')continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;b=p}}return[b,bd/KM]}
function showPlace(p,fly=true){
  state.sel=p;state.drop=null;const e=Math.round(elev(p.x,p.y));
  cardbody.innerHTML=`<h2>${p.name}</h2><div class="cat">${CAT_LABEL(p)}${p.cat!=='town'?' · '+(Math.hypot(p.x-LX,p.y-LY)<Math.hypot(p.x-CX,p.y-CY)?'Moletown':p.y<430?'Aeromechanica':'Hilltown'):''}</div>
   <div class="btns">${btn('zoom','Zoom in',true)}${btn('measure','Measure from here')}${btn('copy','Copy grid ref')}</div>
   <div class="facts"><div><b>Grid ref</b>${gridRef(p.x,p.y)}</div><div><b>Elevation</b>${e} m</div>${p.id==='walk'?'<div><b>Length</b>5.8 km</div>':''}</div>
   <p>${p.desc}</p>`;
  card.classList.add('show');moveCtrls();if(fly)flyTo(p.x,p.y,Math.max(p.z+0.6,zrel()));else render();
}
function showDrop(x,y){
  state.sel=null;state.drop={x,y};const [n,d]=nearest(x,y);
  cardbody.innerHTML=`<h2>Dropped pin</h2><div class="cat">${d<0.3?'At':'Near'} ${n.name}, ${d.toFixed(1)} km</div>
   <div class="btns">${btn('measure','Measure from here',true)}${btn('copy','Copy grid ref')}</div>
   <div class="facts"><div><b>Grid ref</b>${gridRef(x,y)}</div><div><b>Elevation</b>${Math.round(elev(x,y))} m</div></div>`;
  card.classList.add('show');moveCtrls();render();
}
function showMeasure(){
  const pts=state.mpts;let d=0;for(let i=1;i<pts.length;i++)d+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  let climb=0;for(let i=1;i<pts.length;i++){const n=Math.max(2,Math.ceil(Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1])/4));let prev=elev(...pts[i-1]);for(let j=1;j<=n;j++){const t=j/n,e=elev(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t);if(e>prev)climb+=e-prev;prev=e}}
  cardbody.innerHTML=`<h2>Measure distance</h2><div class="cat">${pts.length<2?'Tap the map to add points':'Tap to add more points'}</div>
   <div class="facts"><div><b>Total distance</b><span style="font-size:20px">${(d/KM).toFixed(2)} km</span></div><div><b>Total climb</b><span style="font-size:20px">${Math.round(climb)} m</span></div><div><b>Walking time</b><span style="font-size:20px">${pts.length<2?'–':Math.round((d/KM)/5*60+climb/10)+' min'}</span></div></div>
   <div class="btns">${btn('undo','Undo')}${btn('clear','Clear')}${btn('done','Done',true)}</div>`;
  card.classList.add('show');moveCtrls();render();
}
function closeCard(){card.classList.remove('show');if(state.sel){q.value='';clearq.style.display='none'}state.sel=null;state.drop=null;if(state.measure)toggleMeasure(false);moveCtrls();render()}
function moveCtrls(){const show=card.classList.contains('show')&&W()<760;const h=show?card.offsetHeight:0;
  document.getElementById('ctrls').style.bottom=`calc(${(show?h:0)+28}px + env(safe-area-inset-bottom))`;document.getElementById('scale').style.bottom=`calc(${(show?h:0)+10}px + env(safe-area-inset-bottom))`}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity=0,1600)}
cardbody.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  const ref=state.sel||state.drop;
  if(act==='zoom'&&state.sel)flyTo(state.sel.x,state.sel.y,Math.max(zrel()*2,state.sel.z+2));
  if(act==='copy'&&ref){const t='Hilltown grid ref '+gridRef(ref.x,ref.y);try{navigator.clipboard.writeText(t).then(()=>toast('Grid ref copied'),()=>toast(t))}catch(_){toast(t)}}
  if(act==='measure'&&ref){const p=[ref.x,ref.y];state.sel=null;state.drop=null;toggleMeasure(true);state.mpts=[p];showMeasure()}
  if(act==='undo'){state.mpts.pop();showMeasure()}
  if(act==='clear'){state.mpts=[];showMeasure()}
  if(act==='done'){toggleMeasure(false);closeCard()}
});
document.getElementById('closecard').onclick=closeCard;
function toggleMeasure(on){state.measure=on;document.getElementById('measureBtn').classList.toggle('on',on);svg.classList.toggle('measuring',on);if(!on)state.mpts=[];}
document.getElementById('measureBtn').onclick=()=>{if(state.measure){toggleMeasure(false);closeCard()}else{state.sel=null;state.drop=null;toggleMeasure(true);showMeasure()}};

/* ---------- layer chips ---------- */
const CHIPS=[["terrain","Terrain","terrain"],["transit","Transit","train"],["trails","Walking","walk"],["underground","Underground","drop"],["crash","Crash zones","plane"],["flood","Flood plain","drop"]];
const chipsEl=document.getElementById('chips');
function drawChips(){chipsEl.innerHTML=CHIPS.map(([k,t,i])=>`<button class="chip${state.layers[k]?' on':''}" data-k="${k}"><svg viewBox="0 0 24 24"><path fill="currentColor" d="${IC[i]}"/></svg>${t}</button>`).join('')}
chipsEl.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const k=c.dataset.k;state.layers[k]=!state.layers[k];applyLayers();drawChips();render()};
function applyLayers(){const l=state.layers;layers.terrain.style.display=l.terrain?'':'none';layers.contours.style.display=l.terrain?'':'none';
  layers.land.style.display=l.terrain?'none':'';layers.areas.style.opacity=l.terrain?.55:1;
  layers.rail.style.opacity=l.transit?1:.35;layers.trails.style.display=l.trails?'':'none';layers.underground.style.display=l.underground?'':'none';layers.crash.style.display=l.crash?'':'none';layers.flood.style.display=l.flood?'':'none'}

/* ---------- search ---------- */
const q=document.getElementById('q'),results=document.getElementById('results'),clearq=document.getElementById('clearq');
function doSearch(){const t=q.value.trim().toLowerCase();clearq.style.display=t?'block':'none';if(!t){results.style.display='none';return}
  const m=D.places.filter(p=>(p.name+' '+p.alias+' '+CAT_LABEL(p)).toLowerCase().includes(t)).slice(0,8);
  results.innerHTML=m.length?m.map(p=>`<div class="res" data-id="${p.id}"><div class="ico" style="background:${CAT[p.cat][0]}"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="#fff" d="${IC[p.cat==='town'?'pin':iconFor(p)]}"/></svg></div><div><div class="t">${p.name}</div><div class="s">${CAT_LABEL(p)} · grid ${gridRef(p.x,p.y)}</div></div></div>`).join(''):`<div class="res"><div class="s">No places match "${q.value}"</div></div>`;
  results.style.display='block'}
q.addEventListener('input',doSearch);q.addEventListener('focus',doSearch);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=results.querySelector('.res[data-id]');if(f)f.click()}});
clearq.onclick=()=>{q.value='';doSearch();q.focus()};
results.onclick=e=>{const r=e.target.closest('.res[data-id]');if(!r)return;const p=D.places.find(p=>p.id===r.dataset.id);results.style.display='none';q.value=p.name;q.blur();if(state.measure)toggleMeasure(false);showPlace(p)};

/* ---------- gestures ---------- */
const ptrs=new Map();let down=null,lastTap=0,pinch=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);cancelAnimationFrame(anim);
  if(ptrs.size===1){down={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,target:e.target,tx:V.tx,ty:V.ty}}
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2]};if(down)down.moved=true}
  results.style.display='none';q.blur()});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2&&pinch){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    V.tx+=m[0]-pinch.m[0];V.ty+=m[1]-pinch.m[1];zoomAt(m[0],m[1],d/pinch.d);pinch={d,m};render();return}
  if(ptrs.size===1&&down){const dx=e.clientX-prev[0],dy=e.clientY-prev[1];if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>6){down.moved=true;svg.classList.add('dragging')}
    if(down.moved){V.tx+=dx;V.ty+=dy;clampView();render()}}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);svg.classList.remove('dragging');if(ptrs.size<2)pinch=null;
  if(ptrs.size===0&&down){const d=down;down=null;if(d.moved)return;const now=performance.now();
    if(now-lastTap<300&&!state.measure){lastTap=0;zoomAt(e.clientX,e.clientY,2);fly({...V},1);return}lastTap=now;
    const tgt=d.target.closest&&d.target.closest('[data-id]');
    if(state.measure){state.mpts.push(toW(e.clientX,e.clientY));showMeasure();return}
    if(tgt){const p=D.places.find(p=>p.id===tgt.dataset.id);if(p){showPlace(p);return}}
    const[wx,wy]=toW(e.clientX,e.clientY);
    setTimeout(()=>{if(lastTap!==now)return;
      if(wx<W0.x||wy<W0.y||wx>W0.x+W0.w||wy>W0.y+W0.h){closeCard();return}
      if(card.classList.contains('show')&&!state.drop){closeCard();return}
      showDrop(wx,wy)},310)}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0018)));render()},{passive:false});
document.getElementById('zin').onclick=()=>{const t={...V};V=t;const c=[W()/2,H()/2];const s={...V};zoomAt(c[0],c[1],1.8);const tgt={...V};V=s;fly(tgt,250)};
document.getElementById('zout').onclick=()=>{const c=[W()/2,H()/2];const s={...V};zoomAt(c[0],c[1],1/1.8);const tgt={...V};V=s;fly(tgt,250)};
document.getElementById('homeBtn').onclick=()=>fitAll(true);
window.addEventListener('resize',()=>{render();moveCtrls()});
window.addEventListener('keydown',e=>{if(document.activeElement===q)return;if(e.key==='+'||e.key==='=')document.getElementById('zin').click();if(e.key==='-')document.getElementById('zout').click();if(e.key==='Escape')closeCard()});

drawChips();applyLayers();fitAll(false);
</script>
</body>
</html>
